<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora web</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Calculadora web</h1>
    </header>
    <div class="contenedor-principal">
        <main>
            <div class="calculadora">

                <section class="display-calc">
                    <p id="display-calc-val">0</p>
                </section>

                <section class="contenedor-calculadora">

                    <button class="bt-op">(</button>
                    <button class="bt-op">)</button>
                    <button class="bt-op">^</button>
                    <button class="bt-op">/</button>

                    <button class="bt-num">1</button>
                    <button class="bt-num">2</button>
                    <button class="bt-num">3</button>
                    <button class="bt-op">+</button>

                    <button class="bt-num">4</button>
                    <button class="bt-num">5</button>
                    <button class="bt-num">6</button>
                    <button class="bt-op">-</button>

                    <button class="bt-num">7</button>
                    <button class="bt-num">8</button>
                    <button class="bt-num">9</button>
                    <button class="bt-op">*</button>

                    <button class="bt-num">0</button>
                    <button class="bt-num">.</button>
                    <button class="bt-cl">C</button>

                    <button class="bt-del">DEL</button>
                    <button class="bt-eq">=</button>



                </section>
            </div>
        </main>

        <aside>
            <a href="https://github.com/iJoseG" target="_blank" rel="noopener noreferrer">Mi Github</a>
            <button class="btn-dark">Dark Sunday</button>
        </aside>


    </div>
    <footer>
        <a href="index.html">Volver al inicio</a>
        <p>© José Guerra | 2026</p>
    </footer>

    <script src="script.js"></script>
    <script src="calc.js"></script>
</body>



</html>
